apiVersion: 1

datasources:
- name: loadtest-source
  type: prometheus
  access: proxy
  orgId: 1
  url: http://localhost:9090
  isDefault: true
  version: 1
  editable: true
  jsonData:
    timeInterval: "5s"
    httpMethod: "GET"
- name: Loki
  type: loki
  access: proxy
  url: http://localhost:3100
  jsonData:
    timeout: 60
    maxLines: 1000
